name: Deploy to Azure
# Runs after the Docker image is pushed to GHCR. Skips until deploy/azure/setup.sh has set the AZURE_APP variable.
on:
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:  # one rollout at a time; Container Apps rejects overlapping updates
  group: azure-deploy
  cancel-in-progress: false
permissions:
  id-token: write   # OIDC login to Azure, no stored password
  contents: read
jobs:
  deploy:
    if: vars.AZURE_APP != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image to Azure Container Apps
        run: |
          TAG=${{ github.event.workflow_run.head_sha || 'latest' }}  # manual runs use the latest pushed image
          az extension add --name containerapp --upgrade -y --only-show-errors
          for i in 1 2 3 4; do  # a just-pushed GHCR tag can take a minute to become pullable
            az containerapp update -n "${{ vars.AZURE_APP }}" -g "${{ vars.AZURE_RG }}" \
              --image "ghcr.io/${{ github.repository_owner }}/de-assistant:$TAG" -o none && exit 0
            echo "retry $i in 45s"; sleep 45
          done
          exit 1
      - name: Smoke test the live URL
        run: |
          WANT=${{ github.event.workflow_run.head_sha || '' }}
          for i in $(seq 1 60); do  # wait until the new image is the one answering, not just any replica
            H=$(curl -sf "${{ vars.AZURE_URL }}/health" || true)
            if [ -n "$H" ] && { [ -z "$WANT" ] || echo "$H" | grep -q "\"version\":\"$WANT\""; }; then echo "$H"; exit 0; fi
            sleep 10
          done
          echo "live /health never reported version $WANT: $H" && exit 1
