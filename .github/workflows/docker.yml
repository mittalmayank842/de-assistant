name: Docker image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., load: true, tags: "de-assistant:test"}
      - name: Deploy smoke test (start the API container, call /health)
        run: |
          docker run -d --name api -p 8000:8000 de-assistant:test
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep -q '"ok":true'
          docker logs api | tail -20
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/de-assistant:latest,ghcr.io/${{ github.repository_owner }}/de-assistant:${{ github.sha }}
