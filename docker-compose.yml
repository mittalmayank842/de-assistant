services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      PIPELINE_HOME: /pipeline
      CHROMA_DIR: /app/.chroma
    volumes:
      - ../crypto-market-pipeline:/pipeline:ro   # read the pipeline's Delta tables and run report
    depends_on: [ollama]

volumes:
  ollama:
